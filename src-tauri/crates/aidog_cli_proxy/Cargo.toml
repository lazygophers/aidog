[package]
name = "aidog_cli_proxy"
edition = { workspace = true }
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

# 票 07：本 crate 也用 aidog_core 的 `tauri_command!` 定义命令，两种展开形态的开关
# 必须在**调用宏的 crate** 上声明（cfg 在展开处求值），并转发给 aidog_core。
[features]
default = ["desktop", "http"]
desktop = ["dep:tauri", "aidog_core/desktop"]
http = ["aidog_core/http"]

# aidog_cli_proxy：CLIProxyAPI 域（拆自 aidog_core::gateway::cli_proxy_parser + cli_proxy_cmd，
# 2026-08-16）。tauri commands 依赖 aidog_core 的 tauri_command! 宏与 quota/models。
[dependencies]
tempfile = { workspace = true }
aidog_core = { path = "../aidog_core" }
aidog_db = { path = "../aidog_db" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
rusqlite = { workspace = true }
tracing = { workspace = true }
aidog_ctx = { path = "../aidog_ctx" }
zip = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
# `desktop` 展开出的 `#[tauri::command]` 落在**本 crate**里，所以 tauri 必须是本 crate 的
# 直接依赖；`http` 单形态（无头内核）下不链它。
tauri = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
