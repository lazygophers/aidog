name: Release

# 触发：根目录 .version 变更（版本唯一可信源）→ 多平台构建 + 签名 + 发布 GitHub Release + 生成 updater latest.json。
on:
  push:
    branches: [master]
    paths:
      - ".version"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 手动 dispatch 时清旧 tag+release，让 tauri-action 干净重建（撞 tag 根因：v<版本> 已存在时 tauri-action 失败）。
  # push 触发(.version 变更)本就是新版本无碰撞 → 跳过；`|| true` 幂等，删不存在的 tag 不报错。
  cleanup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Delete existing release + tag (手动重发)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(tr -d '[:space:]' < .version)
          gh release delete "v$V" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

  release:
    # cleanup 在 push 事件被 skip：always() && result != failure 让 push 路径照跑（skipped != failure）。
    needs: cleanup
    if: always() && needs.cleanup.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # macOS Universal（arm64 + x64 合一安装包）
            args: "--target universal-apple-darwin"
            target: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest # x64
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    # 强制 yarn(berry) 缓存落到项目本地 .yarn/cache：跨平台路径确定，供下方 actions/cache 缓存。
    env:
      YARN_ENABLE_GLOBAL_CACHE: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      # yarn@4(berry) 依赖缓存：setup-node 的 cache:yarn 在 corepack 前跑会读错目录，故用显式 cache。
      # restore/save 分离：默认 actions/cache 在 job 失败时跳过 save，拆开后 save 步带 if:always() 保证失败也缓存。
      - name: Restore yarn cache
        uses: actions/cache/restore@v5
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-on-failure: true # job 失败也保存 Rust 缓存（编译产物可被下次复用）

      - name: Install frontend deps
        run: yarn install --immutable

      - name: Verify version sync (.version 单一源)
        run: node scripts/sync-version.mjs --check

      # 内联读版本号（曾是独立 read-version job，为一行 echo 起整台 ubuntu runner，浪费一次 spin-up）。
      - name: Read version (.version 单一源)
        id: v
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .version)" >> "$GITHUB_OUTPUT"

      - name: Build & publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.v.outputs.version }}
          releaseName: AiDog v${{ steps.v.outputs.version }}
          releaseBody: |
            ## 🐕 AiDog — 统一管理你的 AI API 网关

            本地桌面应用 · 无需上云 · 50+ 平台一键聚合 · 智能路由 · 用量统计

            ### 📦 下载

            | 平台 | 安装包 |
            | --- | --- |
            | macOS（Apple Silicon + Intel） | `*_universal.dmg` |
            | Windows x64 | `*_x64-setup.exe`（推荐）/ `*_x64_en-US.msi` |

            ### 🍎 macOS 首次打开

            应用未经 Apple 公证，若提示「已损坏」或「无法验证开发者」，执行一次后即可打开：

            ```bash
            xattr -dr com.apple.quarantine /Applications/AiDog.app
            ```

            ### 🔄 自动更新

            客户端「关于」页可检查并一键更新；`.sig` / `latest.json` 为更新签名文件，无需手动下载。

            ### 🐕‍🦺 Flutter 版（迁移预览）

            `AiDog-Flutter-*` 是新 Flutter 壳（读 `flutter-appcast.xml` 自动更新，与上面的安装包互不影响）。装了 Flutter 版想回 Tauri 版：从本页下载上一个版本的 `*_universal.dmg` / `*_x64-setup.exe` 覆盖安装即可。

            ### 📖 文档

            https://lazygophers.github.io/aidog/zh/
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # 保存 yarn 缓存：if:always() 保证 build 失败也存（与 restore 同 key；命中精确 key 时 actions/cache 自动跳过写入）。
      - name: Save yarn cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}

  # ── Flutter 壳（票 I13）── 与老 Tauri 壳并存：同一个 Release 里两套产物、两个 feed
  #（Tauri 读 latest.json，Flutter 读 flutter-appcast.xml），谁也装不上对方的包。
  flutter-release:
    needs: cleanup
    if: always() && needs.cleanup.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Flutter macOS release 默认 universal（arm64 + x64）
            cargo_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest # x64
            cargo_targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    env:
      FLUTTER_VERSION: 3.47.2
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-on-failure: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Read version (.version 单一源)
        id: v
        shell: bash
        run: |
          echo "version=$(tr -d '[:space:]' < .version)" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Verify version sync
        run: node scripts/sync-version.mjs --check

      - name: flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Build macOS app (universal, kernel bundled by Xcode phase)
        if: matrix.platform == 'macos-latest'
        working-directory: flutter
        run: flutter build macos --release --build-name=${{ steps.v.outputs.version }} --build-number=${{ steps.v.outputs.build }}

      - name: Zip macOS app (Sparkle 要 ditto zip)
        if: matrix.platform == 'macos-latest'
        run: |
          V=${{ steps.v.outputs.version }}
          cd flutter/build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent AiDog.app "AiDog-Flutter-v${V}-macos-universal.zip"

      - name: Sign macOS update artifact (Sparkle EdDSA)
        if: matrix.platform == 'macos-latest'
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        working-directory: flutter/build/macos/Build/Products/Release
        shell: bash
        run: |
          V=${{ steps.v.outputs.version }}
          SIG=$(printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" | \
            ../../../../../macos/Pods/Sparkle/bin/sign_update "AiDog-Flutter-v${V}-macos-universal.zip" --ed-key-file - | \
            sed -E 's/.*edSignature="([^"]+)".*/\1/')
          test -n "$SIG"
          printf '{"edSignature":"%s","file":"AiDog-Flutter-v%s-macos-universal.zip"}\n' "$SIG" "$V" > mac.json

      - name: Upload macOS artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-macos
          path: |
            flutter/build/macos/Build/Products/Release/AiDog-Flutter-v*-macos-universal.zip
            flutter/build/macos/Build/Products/Release/mac.json

      - name: Build Windows app (kernel bundled by CMake install step)
        if: matrix.platform == 'windows-latest'
        working-directory: flutter
        run: flutter build windows --release --build-name=${{ steps.v.outputs.version }} --build-number=${{ steps.v.outputs.build }}

      - name: Build installer (Inno Setup)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = "${{ steps.v.outputs.version }}"
          iscc "/DMyAppVersion=$v" flutter\packaging\flutter_windows.iss

      - name: Sign Windows update artifact (WinSparkle DSA)
        if: matrix.platform == 'windows-latest'
        env:
          WINSPARKLE_DSA_PRIVATE_KEY: ${{ secrets.WINSPARKLE_DSA_PRIVATE_KEY }}
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $exe = "flutter\build\installer\AiDog-Flutter-v$v-x64-setup.exe"
          $keyFile = New-TemporaryFile
          [IO.File]::WriteAllText($keyFile, $env:WINSPARKLE_DSA_PRIVATE_KEY)
          $tool = "flutter\windows\flutter\ephemeral\.plugin_symlinks\auto_updater_windows\windows\WinSparkle-0.8.1\bin\sign_update.bat"
          $out = & cmd /c "`"$tool`" `"$exe`" `"$keyFile`" 2>&1"
          Remove-Item $keyFile
          $sig = [regex]::Match(($out -join " "), 'dsaSignature="([^"]+)"').Groups[1].Value
          if (-not $sig) { throw "dsaSignature 解析失败: $out" }
          @{ dsaSignature = $sig; file = "AiDog-Flutter-v$v-x64-setup.exe" } |
            ConvertTo-Json -Compress | Out-File -Encoding ascii flutter\build\installer\win.json

      - name: Upload Windows artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-windows
          path: |
            flutter/build/installer/AiDog-Flutter-v*-x64-setup.exe
            flutter/build/installer/win.json

  # 汇总两平台的签名元数据 → 生成 flutter-appcast.xml，把 Flutter 产物挂上同一个 Release。
  # needs.release：tauri-action 先把 Release 建出来，gh release upload 才有地方传。
  flutter-appcast:
    needs: [cleanup, release, flutter-release]
    if: always() && needs.cleanup.result != 'failure' && needs.release.result == 'success' && needs.flutter-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Read version
        id: v
        run: echo "version=$(tr -d '[:space:]' < .version)" >> "$GITHUB_OUTPUT"

      - name: Download flutter artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: flutter-*
          path: dist
          merge-multiple: true

      - name: Generate appcast
        run: node scripts/gen-flutter-appcast.mjs --version ${{ steps.v.outputs.version }} --build ${{ github.run_number }} --dir dist --tag v${{ steps.v.outputs.version }}

      - name: Attach flutter artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.v.outputs.version }}
          gh release upload "v$V" dist/AiDog-Flutter-v*-macos-universal.zip dist/AiDog-Flutter-v*-x64-setup.exe dist/flutter-appcast.xml --clobber
