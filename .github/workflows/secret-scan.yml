name: secret-scan

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz
          ./gitleaks version

      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -e
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          elif [ -n "$BEFORE_SHA" ] && ! expr "$BEFORE_SHA" : '^0*$' >/dev/null; then
            RANGE="${BEFORE_SHA}..${GITHUB_SHA}"
          else
            RANGE="-1"
          fi
          if [ "$RANGE" = "-1" ]; then
            ./gitleaks detect --source . --redact --exit-code 1
          else
            ./gitleaks detect --source . --redact --exit-code 1 --log-opts="$RANGE"
          fi
